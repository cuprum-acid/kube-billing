apiVersion: billing.cloud-native.io/v1alpha1
kind: BillingPlan
metadata:
  name: basic
  labels:
    app.kubernetes.io/name: kube-billing
    app.kubernetes.io/managed-by: kustomize
spec:
  price: "10.00"
  currency: USD
  billingPeriod: monthly
  limits:
    apiCalls: 10000
  requeueIntervalSeconds: 30
