apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: controller-manager-pdb
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kube-billing
spec:
  # Ensure at least 1 pod is always available during voluntary disruptions
  # (e.g., node drains, cluster upgrades)
  minAvailable: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: kube-billing
