apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: controller-manager-hpa
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kube-billing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: controller-manager
  # Scale between 1 and 5 replicas
  minReplicas: 1
  maxReplicas: 5
  metrics:
  # Scale based on CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  # Scale based on memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Behavior configuration
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
